name: Sync and Pages
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 重新获取全部静态图片
        type: boolean
        default: false
      allow_removals:
        description: 接受超过 10% 的真实目录删除
        type: boolean
        default: false
      publish:
        description: 构建后发布（仍需仓库变量启用）
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mirror-sync-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Define snapshot cache keys
        id: snapshot-cache
        env:
          SNAPSHOT_CACHE_PREFIX: mirror-v1-${{ runner.os }}-
          SNAPSHOT_CACHE_KEY: mirror-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          echo "prefix=$SNAPSHOT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "key=$SNAPSHOT_CACHE_KEY" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .mirror/current
          key: ${{ steps.snapshot-cache.outputs.key }}
          restore-keys: ${{ steps.snapshot-cache.outputs.prefix }}
      - name: Synchronize complete snapshot
        run: node --use-system-ca scripts/workflow-sync.ts
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh }}
          ALLOW_REMOVALS: ${{ inputs.allow_removals }}
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - name: Save validated snapshot
        id: save-cache
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .mirror/current
          key: ${{ steps.snapshot-cache.outputs.key }}
      - name: Confirm saved snapshot and prune old caches
        id: prune-cache
        if: steps.save-cache.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          SNAPSHOT_CACHE_PREFIX: ${{ steps.snapshot-cache.outputs.prefix }}
          SNAPSHOT_CACHE_KEY: ${{ steps.snapshot-cache.outputs.key }}
        with:
          script: |
            const prefix = process.env.SNAPSHOT_CACHE_PREFIX;
            const key = process.env.SNAPSHOT_CACHE_KEY;
            if (!prefix || !key || !key.startsWith(prefix)) {
              throw new Error('Invalid snapshot cache key or prefix');
            }

            // A successful save step can still mean the cache was not saved.
            // Collect every page before deleting, so pagination stays stable.
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { ...context.repo, ref: context.ref, key: prefix, per_page: 100 },
            );
            const saved = caches.find(cache =>
              cache.ref === context.ref && cache.key === key
            );
            if (!saved) {
              core.warning('未确认新快照缓存保存成功；保留全部旧缓存。');
              return;
            }

            const oldCaches = caches.filter(cache =>
              cache.ref === context.ref &&
              cache.key.startsWith(prefix) &&
              cache.key !== key
            );
            for (const cache of oldCaches) {
              await github.rest.actions.deleteActionsCacheById({
                ...context.repo,
                cache_id: cache.id,
              });
              core.info(`Deleted old snapshot cache: ${cache.key} (${cache.id})`);
            }
      - name: Report cache warning
        if: steps.save-cache.outcome == 'failure' || steps.prune-cache.outcome == 'failure'
        run: node -e "console.log('::warning::快照缓存保存或清理失败；未确认新缓存时保留旧缓存，网站产物仍有效。')"
      - name: Save reusable website archive
        uses: actions/upload-artifact@v6
        with:
          name: website-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 14
      - name: Prepare Pages artifact
        if: vars.PAGES_DEPLOY_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.publish == true)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Save diagnostic reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sync-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            test-results/
          retention-days: 7
  deploy:
    needs: build
    if: vars.PAGES_DEPLOY_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
